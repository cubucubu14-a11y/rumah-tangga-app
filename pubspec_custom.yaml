name: rumah_tangga_app
description: Aplikasi pengeluaran rumah tangga
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.2.2
  http: 1.2.0
  intl: 0.19.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.jpg"
  adaptive_icon_background: "#A8E6CF"
  adaptive_icon_foreground: "icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
